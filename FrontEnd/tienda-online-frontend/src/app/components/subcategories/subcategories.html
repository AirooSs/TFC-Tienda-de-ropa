<nav class="barra-subcategorias">
  <div class="contenedor-subcategorias">
    @for (subcat of subcategorias; track subcat) {
      <a 
        [routerLink]="['/categoria', categoria, subcat.toLowerCase()]"
        routerLinkActive="activa"
        class="enlace-subcategoria">
        {{ subcat }}
      </a>
    }
  </div>
</nav>
