<div class="search">
    <button type="button" class="icon-btn" (click)="toggle()" title="Búsqueda">
        <img src="/img/magnifying-glass-solid-full.svg" alt="Búsqueda" class="nav-icon" />
    </button>

    @if (open) {
    <form (ngSubmit)="submit()" class="search-form">
        <input type="text" placeholder="Buscar producto..." [(ngModel)]="query" name="q" autofocus />
    </form>
    }
</div>
