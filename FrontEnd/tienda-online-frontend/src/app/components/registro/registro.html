<!-- TOAST flotante -->
<div class="toast" [class.show]="toastVisible" [class.success]="toastType === 'success'"
    [class.error]="toastType === 'error'">
    <span class="toast-text">{{ toastMessage }}</span>

    <button type="button" class="toast-close" (click)="cerrarToast()">
    </button>
</div>

<div class="registro-container">
    <div class="registro-card">
        <h2>Crear cuenta</h2>

        <form (ngSubmit)="registrar()">

            <div class="form-group">
                <label>Nombre</label>
                <input type="text" [(ngModel)]="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label>Apellidos</label>
                <input type="text" [(ngModel)]="apellidos" name="apellidos" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" [(ngModel)]="email" name="email" required>
            </div>

            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" [(ngModel)]="password" name="password" required>
            </div>

            <button type="submit" class="btn-submit">
                Registrarse
            </button>

        </form>
    </div>
</div>
